<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Labib Rush — Avenue Habib Bourguiba</title>
    <meta name="description" content="Race the clock as Labib, Tunisia's anti-litter fennec: grab litter, chase plastic bags in the wind and kick cans into bins on a golden-hour Avenue Habib Bourguiba. Free 3D browser game." />
    <meta name="theme-color" content="#c8102e" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Labib Rush" />
    <meta property="og:title" content="Labib Rush — Avenue Habib Bourguiba" />
    <meta property="og:description" content="Clean up Tunis before the clock hits zero. Combos, trick shots, flying bags and yellow taxis — one more run!" />
    <meta property="og:url" content="https://labib-rush.vercel.app" />
    <meta property="og:image" content="https://labib-rush.vercel.app/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Labib the fennec running down a golden-hour Avenue Habib Bourguiba" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Labib Rush — Avenue Habib Bourguiba" />
    <meta name="twitter:description" content="Clean up Tunis before the clock hits zero. Combos, trick shots, flying bags and yellow taxis — one more run!" />
    <meta name="twitter:image" content="https://labib-rush.vercel.app/og.jpg" />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #1c140d; color: #fff;
        overscroll-behavior: none; touch-action: none; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
      body { font-family: Cairo, system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
      #app { position: fixed; inset: 0; overflow: hidden; }
      .boot-msg { position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; padding: 24px; text-align: center;
        background: radial-gradient(ellipse at 50% 35%, #7a3b1c 0%, #2a1a10 60%, #140d08 100%); }
      .boot-msg[hidden] { display: none; }
      .boot-msg div { max-width: 460px; }
      .boot-msg img { width: 88px; height: 88px; }
      .boot-msg h1 { margin: 14px 0 8px; font-size: 24px; }
      .boot-msg p { margin: 0 0 18px; line-height: 1.5; opacity: .88; }
      .boot-msg button { font: inherit; font-weight: 700; padding: 10px 22px; border-radius: 999px; border: 0; background: #e70013; color: #fff; cursor: pointer; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot-error" class="boot-msg" role="alert" hidden>
      <div>
        <img src="/favicon.svg" alt="" />
        <h1>Something went wrong</h1>
        <p></p>
        <button type="button" onclick="location.reload()">Reload</button>
      </div>
    </div>
    <noscript>
      <div class="boot-msg">
        <div>
          <img src="/favicon.svg" alt="" />
          <h1>Labib Rush needs JavaScript</h1>
          <p>Turn on JavaScript to help Labib clean up Avenue Habib Bourguiba.</p>
        </div>
      </div>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
